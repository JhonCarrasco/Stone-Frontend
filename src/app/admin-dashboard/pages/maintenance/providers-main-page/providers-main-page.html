<h1 class="text-2xl font-bold">Listado de proveedores</h1>
<p class="text-sm text-gray-500">
  Aquí puedes ver y buscar todos los proveedores.
</p>
<div class="divider"></div>

<div class="flex gap-2 items-center h-20">
  <app-pagination
    [pages]="providersResource.value()?.pages ?? 0"
    [currentPage]="paginationService.currentPage()"
  />

  <select
    class="select select-bordered w-32"
    (change)="elementsPerPage.set(+selectPerPage.value)"
    #selectPerPage
  >
    <option value="10">10</option>
    <!-- <option value="20">20</option> -->
    <!-- <option value="50">50</option> -->
    <option value="100">100</option>
  </select>

  <div class="flex-1">
    <search-provider
      [withDatalist]="false"
      (providerEvent)="onSearchProviderChange($event)"
      [providersFound]="[]"
    />
  </div>

  <button class="btn btn-primary" routerLink="/admin/providers/new">
    Nuevo proveedor
  </button>
</div>

<provider-table [providers]="providersResource.value()?.data ?? []" />
