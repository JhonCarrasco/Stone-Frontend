<h1 class="text-2xl font-bold">Comprobantes de Material</h1>
<p class="text-sm text-gray-500">
  Aquí puedes ver todas los comprobantes de material.
</p>
<div class="divider"></div>

<div class="flex gap-2 items-center h-20">
  <app-pagination
    [pages]="vouchersResource.value()?.pages ?? 0"
    [currentPage]="paginationService.currentPage()"
  />

  <select
    class="select select-bordered w-32"
    (change)="elementsPerPage.set(+selectPerPage.value)"
    #selectPerPage
  >
    <option value="10">10</option>
    <!-- <option value="20">20</option>     
    <option value="50">50</option> -->
    <option value="100">100</option>
  </select>

  <div class="flex-1">
    <search-voucher (voucherEvent)="onSearchVoucherChange($event)" />
  </div>

  <button class="btn btn-primary" routerLink="/admin/materials/voucher/new">
    Nuevo
  </button>
</div>

<voucher-table [vouchers]="vouchersResource.value()?.data ?? []" />
