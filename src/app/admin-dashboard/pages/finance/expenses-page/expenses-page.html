<h1 class="text-2xl font-bold">Rendición de gastos</h1>
<p class="text-sm text-gray-500">
  Aquí puedes ver todos las rediciones de gastos.
</p>

<div class="divider"></div>

<div class="flex gap-2 items-center h-20">
  <!-- <app-pagination
    [pages]="expensesResource.value()?.pages ?? 0"
    [currentPage]="paginationService.currentPage()"
  /> -->
  <app-pagination
    [pages]="expensesResource().pages"
    [currentPage]="paginationService.currentPage()"
  />

  <select
    class="select select-bordered w-32"
    (change)="elementsPerPage.set(+selectPerPage.value)"
    #selectPerPage
  >
    <option value="10">10</option>
    <!-- <option value="20">20</option>
    <option value="50">50</option> -->
    <option value="100">100</option>
  </select>

  <div class="flex-1">
    <search-expense (expenseEvent)="onSearchExpenseChange($event)" />
  </div>

  <button class="btn btn-primary" routerLink="/admin/finances/expenses/new">
    Nuevo
  </button>
</div>

<!-- <expense-table [expenses]="expensesResource.value()?.data ?? []" /> -->
<expense-table [expenses]="this.expensesResource().data" />
