<h1 class="text-2xl font-bold">Listado de presupuestos</h1>
<!-- <h3 class="text-lg">
  Total de presupuestos:
  <span class="text-accent">{{ budgetsResource.value()?.count ?? 0 }}</span>
</h3> -->
<div class="divider"></div>

<div class="flex gap-2 items-center h-20">
  <app-pagination
    [pages]="budgetsResource.value()?.pages ?? 0"
    [currentPage]="paginationService.currentPage()"
  />

  <select
    class="select select-bordered w-32"
    (change)="elementsPerPage.set(+selectPerPage.value)"
    #selectPerPage
  >
    <option value="10">10</option>
    <!-- <option value="20">20</option>
    <option value="50">50</option> -->
    <option value="100">100</option>
  </select>

  <div class="flex-1">
    <search-budget (budgetEvent)="onSearchBudgetChange($event)" />
  </div>

  <button class="btn btn-primary" routerLink="/admin/budgets/new">
    Nuevo presupuesto
  </button>
</div>

<budget-table [budgets]="budgetsResource.value()?.data ?? []" />
