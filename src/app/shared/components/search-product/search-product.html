<div class="flex justify-start content-center border-b border-gray-900/10">
  <div class="col-span-3 w-1/2">
    <input
      list="searchProductText-list"
      id="search-product-text"
      type="text"
      name="searchProductText"
      placeholder="Buscar producto"
      class="input input-bordered w-full"
      (change)="onSelectionSearchProductChange($event)"
      [value]="searchProductText()"
    />
    @if(this.withDatalist()){
    <datalist
      id="searchProductText-list"
      class="datalist datalist-bodered w-full max-h-[100px] overflow-y-auto"
    >
      <option disabled selected>Seleccionar un Producto</option>
      @for (item of productsFound(); track item.id) {
      <!-- <option [value]="item.projectName" [tabIndex]="item.id"></option> -->
      <option [tabIndex]="item.id">
        {{item.productCode}}-{{item.description}}
      </option>

      }
    </datalist>
    }
  </div>

  <div class="col-span-2 ml-2">
    <button
      class="btn btn-primary"
      type="button"
      (click)="onSearchProductBtn()"
    >
      Buscar
    </button>
  </div>
</div>
