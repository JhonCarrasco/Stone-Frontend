<div class="overflow-x-auto bg-gray-900 rounded-2xl p-4">
  <table class="table">
    <!-- head -->
    <thead>
      <tr>
        <th>
          <label>
            <input type="checkbox" class="checkbox" />
          </label>
        </th>
        <th>Nombre/Razón Social</th>
        <th>Rut</th>
        <th>Correo</th>
        <th>Teléfono</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <!-- row 1 -->
      @for (customer of customers(); track customer.id) {
        <tr>
          <th>
            <label>
              <input type="checkbox" class="checkbox" />
            </label>
          </th>
          <td>
            {{ customer.person.displayName }}
          </td>
          <td>
            {{ customer.person.rut }}
          </td>
          <td>
            {{ customer.email }}
          </td>
          <td>
            {{ customer.phone }}
          </td>
          <th>
            <a
              [routerLink]="['/admin/customers', customer.id]"
              class="btn btn-ghost text-accent btn-xs"
              >Detalles</a
            >
          </th>
        </tr>
      }
    </tbody>
  </table>
</div>
